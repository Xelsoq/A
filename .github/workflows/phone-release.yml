name: Build Phone APK (Release)

on:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phone:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache keystore
        id: cache-keystore
        uses: actions/cache@v6
        with:
          path: vz-musicfy.jks
          key: ${{ runner.os }}-keystore-vz-musicfy


# This is not the official release key, those apk's will be universal and manually uploaded.
      - name: Generate keystore if not cached
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkey -v -keystore vz-musicfy.jks -alias musicfy-key -keyalg RSA -keysize 4096 -validity 10000 \
            -storepass 994273 -keypass 994273 \
            -dname "CN=Musicfy, OU=Dev, O=Musicfy, L=World, S=World, C=US"

      - name: Create keystore.properties
        run: |
          echo "storePassword=994273" > keystore.properties
          echo "keyAlias=musicfy-key" >> keystore.properties
          echo "keyPassword=994273" >> keystore.properties

      - name: Build Phone release APK
        run: gradle :app:assembleRelease -Pmusicfy.enableAbiSplits=true

      - name: Verify Phone split APKs
        run: |
          BUILD_TOOLS_VERSION="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          for apk in \
            app/build/outputs/apk/release/app-arm64-v8a-release.apk \
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2" dump badging "$apk" >/dev/null
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          done

      - name: Show APK sizes
        run: |
          ls -lh app/build/outputs/apk/release/app-arm64-v8a-release.apk
          ls -lh app/build/outputs/apk/release/app-armeabi-v7a-release.apk

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Telethon
        run: pip install telethon

      - name: Send Phone split APKs to Telegram (MTProto, up to 2GB)
        run: |
          python3 - <<'PYEOF'
          import asyncio
          from telethon import TelegramClient

          API_ID = 36777223
          API_HASH = "e8f2dedd6db84f864885d087b811db37"
          BOT_TOKEN = "8803306880:AAGgsSBmAgJZnkAtj7gn8aFK1f9xgWxnEiE"
          CHAT_ID = -1004388221744

          apks = [
              "app/build/outputs/apk/release/app-arm64-v8a-release.apk",
              "app/build/outputs/apk/release/app-armeabi-v7a-release.apk",
          ]

          async def main():
              client = TelegramClient("bot_session", API_ID, API_HASH)
              await client.start(bot_token=BOT_TOKEN)
              for apk in apks:
                  print(f"Enviando {apk}...")
                  await client.send_file(
                      CHAT_ID,
                      apk,
                      caption=f"Musicfy release build ({apk.split('/')[-1]})",
                      force_document=True,
                  )
              await client.disconnect()

          asyncio.run(main())
          PYEOF
